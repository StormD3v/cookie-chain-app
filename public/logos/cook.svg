<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cookie background circle -->
  <circle cx="50" cy="50" r="48" fill="#c87820" stroke="#8a5a10" stroke-width="2"/>
  <!-- Cookie texture — lighter inner circle -->
  <circle cx="50" cy="50" r="44" fill="#d98c2a"/>
  <!-- Chocolate chips -->
  <ellipse cx="32" cy="38" rx="7" ry="6" fill="#3e1c08" transform="rotate(-15 32 38)"/>
  <ellipse cx="57" cy="32" rx="6" ry="5" fill="#3e1c08" transform="rotate(10 57 32)"/>
  <ellipse cx="68" cy="55" rx="7" ry="5.5" fill="#3e1c08" transform="rotate(-8 68 55)"/>
  <ellipse cx="40" cy="63" rx="6" ry="5" fill="#3e1c08" transform="rotate(20 40 63)"/>
  <ellipse cx="62" cy="70" rx="5.5" ry="5" fill="#3e1c08" transform="rotate(-5 62 70)"/>
  <ellipse cx="28" cy="58" rx="5" ry="4.5" fill="#3e1c08" transform="rotate(12 28 58)"/>
  <!-- Subtle crack lines -->
  <path d="M50 20 Q53 28 50 35" stroke="#b86010" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M34 45 Q38 50 36 56" stroke="#b86010" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- COOK text -->
  <text x="50" y="56" font-family="'Syne','Arial Black',sans-serif" font-weight="800"
        font-size="18" fill="#f5e6c8" text-anchor="middle" letter-spacing="-0.5">COOK</text>
  <!-- Outer rim highlight -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#f0c060" stroke-width="1" opacity="0.35"/>
</svg>
