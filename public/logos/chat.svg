<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#4a9eba" stroke="#2a6e8a" stroke-width="2"/>
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="44" fill="#5aaecc"/>
  <!-- Chat bubble shape -->
  <rect x="20" y="28" width="60" height="38" rx="10" ry="10" fill="#f5e6c8" opacity="0.92"/>
  <!-- Tail of speech bubble -->
  <path d="M30 66 L24 78 L44 68" fill="#f5e6c8" opacity="0.92"/>
  <!-- Message dots -->
  <circle cx="36" cy="47" r="5" fill="#4a9eba"/>
  <circle cx="50" cy="47" r="5" fill="#4a9eba"/>
  <circle cx="64" cy="47" r="5" fill="#4a9eba"/>
  <!-- CHAT text -->
  <text x="50" y="93" font-family="'Syne','Arial Black',sans-serif" font-weight="800"
        font-size="11" fill="#f5e6c8" text-anchor="middle" letter-spacing="0.5">CHAT</text>
  <!-- Outer rim -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#f0c060" stroke-width="1" opacity="0.35"/>
</svg>
