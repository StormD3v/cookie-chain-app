<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Baked/glowing background -->
  <circle cx="50" cy="50" r="48" fill="#7c2d00" stroke="#4a1800" stroke-width="2"/>
  <!-- Inner warm glow -->
  <circle cx="50" cy="50" r="44" fill="#a03800"/>
  <!-- Flame glow ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#f0c060" stroke-width="2.5" opacity="0.3"/>
  <!-- Flame shape -->
  <path d="M50 25 C45 33 38 36 40 44 C42 50 36 52 38 60 C40 68 46 72 50 74 C54 72 60 68 62 60 C64 52 58 50 60 44 C62 36 55 33 50 25Z"
        fill="url(#flame)" opacity="0.85"/>
  <defs>
    <radialGradient id="flame" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f0c060"/>
      <stop offset="40%" stop-color="#e06020"/>
      <stop offset="100%" stop-color="#a03000"/>
    </radialGradient>
  </defs>
  <!-- bCOOK text -->
  <text x="50" y="58" font-family="'Syne','Arial Black',sans-serif" font-weight="800"
        font-size="15" fill="#f5e6c8" text-anchor="middle" letter-spacing="-0.3">bCOOK</text>
  <!-- Outer rim -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#f0c060" stroke-width="1" opacity="0.4"/>
</svg>
