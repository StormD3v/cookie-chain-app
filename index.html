<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cookie Chain Swap</title>
    <meta name="description" content="Swap COOK and Cookie Chain tokens — fast, cheap, culture-native. Built for degens." />

    <!-- Favicon — mascot crop -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- ── Open Graph ─────────────────────────────────────────── -->
    <!-- For production set VITE_APP_URL in .env.local and replace the -->
    <!-- og:image content with: ${VITE_APP_URL}/og-banner.png          -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Cookie Chain" />
    <meta property="og:title"       content="Cookie Chain Swap" />
    <meta property="og:description" content="Swap COOK and Cookie Chain tokens. Fast, cheap, culture-native. Built for degens." />
    <meta property="og:image"       content="/og-banner.png" />
    <meta property="og:image:width"  content="1734" />
    <meta property="og:image:height" content="907" />
    <meta property="og:image:alt"   content="Cookie Chain Swap — fire-swirl banner" />

    <!-- ── Twitter / X card ──────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Cookie Chain Swap" />
    <meta name="twitter:description" content="Swap COOK and Cookie Chain tokens. Fast, cheap, culture-native. Built for degens." />
    <meta name="twitter:image"       content="/og-banner.png" />
    <meta name="twitter:image:alt"   content="Cookie Chain Swap — fire-swirl banner" />

    <!-- Theme colour — matches --choco -->
    <meta name="theme-color" content="#1a0e08" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
